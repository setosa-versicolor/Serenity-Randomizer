<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serenity Randomizer</title>
<meta name="description" content="Flip coins, roll dice, pick numbers and choose from lists, on a calm tropical beach.">
<meta name="theme-color" content="#6cc7e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Serenity">
<link rel="apple-touch-icon" href="icon.PNG">
<link rel="icon" type="image/png" href="icon.PNG">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script>
  // Apply the saved theme before first paint so there is no flash.
  (function () {
    var pref = 'auto';
    try { pref = (JSON.parse(localStorage.getItem('serenity:v1') || '{}').fields || {}).theme || 'auto'; } catch (e) {}
    var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<style>
/* ---------- Design tokens ---------- */
:root {
  --font-display: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --font-body: "Nunito", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg: 24px; --r-md: 16px; --r-sm: 12px;
  --horizon: 58%;

  --ink: #0f3440; --muted: #4c6b74;
  --card: rgba(255, 255, 255, .74); --card-strong: rgba(255, 255, 255, .94);
  --card-line: rgba(255, 255, 255, .85); --line: rgba(15, 52, 64, .1);
  --field: rgba(255, 255, 255, .9); --field-line: rgba(15, 52, 64, .16);
  --teal: #0b8f84; --teal-soft: #d2f4ef; --coral: #f36b43; --coral-deep: #d94a20;
  --shadow: 0 20px 44px -22px rgba(10, 60, 80, .45), 0 2px 6px rgba(10, 60, 80, .06);

  --sky1: #5dbfdc; --sky2: #9fdde9; --sky3: #ffe2bb; --sky4: #ffc596;
  --sea1: #5fcad2; --sea2: #1f9db1; --sea3: #13758f;
  --sand1: #f7e2b8; --sand2: #ebc68b; --foam: rgba(255, 255, 255, .85);
  --frond-back: #2b8756; --frond-front: #3aa566; --spine: #226b43;
  --trunk1: #b07a4c; --trunk2: #7b5130; --ring: #5a3a1f; --coco: #6a4324;
  --island: #58a3a9; --cloud: #ffffff; --cloud-op: .9;
  --orb1: #ffe9a8; --orb2: #ffc24b; --glow: rgba(255, 196, 100, .6);
  --glint: rgba(255, 244, 214, .75); --stars-op: 0; --birds-op: .55;
}
[data-theme="dark"] {
  --ink: #e4f3f5; --muted: #9bb7c0;
  --card: rgba(10, 24, 46, .64); --card-strong: rgba(18, 36, 64, .92);
  --card-line: rgba(255, 255, 255, .09); --line: rgba(255, 255, 255, .08);
  --field: rgba(255, 255, 255, .06); --field-line: rgba(255, 255, 255, .16);
  --teal: #45d6c8; --teal-soft: rgba(69, 214, 200, .16); --coral: #ff7f59; --coral-deep: #e85d36;
  --shadow: 0 20px 44px -20px rgba(0, 0, 0, .6), 0 2px 6px rgba(0, 0, 0, .2);

  --sky1: #060d26; --sky2: #10204c; --sky3: #28306a; --sky4: #463b74;
  --sea1: #1f2f60; --sea2: #111f45; --sea3: #0a1530;
  --sand1: #3b3654; --sand2: #2a2640; --foam: rgba(190, 210, 255, .35);
  --frond-back: #081a21; --frond-front: #0d232c; --spine: #081a21;
  --trunk1: #141b29; --trunk2: #0d121d; --ring: #070a12; --coco: #0d121d;
  --island: #17264a; --cloud: #7d8fbd; --cloud-op: .22;
  --orb1: #fbf8ea; --orb2: #cfdaf2; --glow: rgba(190, 210, 255, .35);
  --glint: rgba(215, 225, 255, .45); --stars-op: 1; --birds-op: 0;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh; overflow-x: hidden;
  font-family: var(--font-body); font-size: 16px; line-height: 1.45; color: var(--ink);
  background: var(--sky2); -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
svg.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Scene ---------- */
.scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.sky { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 34%, var(--sky3) 50%, var(--sky4) var(--horizon)); transition: background .6s; }
.stars { position: absolute; inset: 0 0 calc(100% - var(--horizon)); opacity: var(--stars-op); transition: opacity .8s; }
.star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: twinkle 4s ease-in-out infinite; }
.sun {
  position: absolute; left: 68%; top: calc(var(--horizon) - 96px); width: 132px; height: 132px; margin-left: -66px; border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, var(--orb1) 0 38%, var(--orb2) 72%);
  box-shadow: 0 0 60px 20px var(--glow), 0 0 160px 60px var(--glow);
}
[data-theme="dark"] .sun { width: 84px; height: 84px; margin-left: -42px; top: calc(var(--horizon) - 190px); }
.cloud { position: absolute; left: 0; width: 240px; opacity: var(--cloud-op); animation: drift linear infinite; transition: opacity .8s; }
.cloud path { fill: var(--cloud); }
.cloud.c1 { top: 7%; animation-duration: 140s; animation-delay: -30s; }
.cloud.c2 { top: 17%; width: 170px; animation-duration: 180s; animation-delay: -120s; }
.cloud.c3 { top: 29%; width: 300px; animation-duration: 220s; animation-delay: -60s; }
.birds { position: absolute; top: 20%; left: 0; width: 60px; opacity: var(--birds-op); animation: drift 90s linear infinite -20s; }
.birds path { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; animation: flap 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.birds path + path { animation-delay: -.5s; }
.island { position: absolute; left: 6%; top: calc(var(--horizon) - 44px); width: 200px; height: 46px; }
.island * { fill: var(--island) !important; stroke: none !important; }
.sea { position: absolute; left: 0; right: 0; top: var(--horizon); bottom: 0; background: linear-gradient(180deg, var(--sea1) 0%, var(--sea2) 30%, var(--sea3) 70%); transition: background .6s; }
.glint {
  position: absolute; left: 68%; top: 0; width: 200px; height: 40%; margin-left: -100px;
  background: repeating-linear-gradient(180deg, var(--glint) 0 2px, transparent 2px 10px);
  -webkit-mask-image: radial-gradient(ellipse 50% 100% at 50% 0%, #000 20%, transparent 75%); mask-image: radial-gradient(ellipse 50% 100% at 50% 0%, #000 20%, transparent 75%);
  animation: shimmer 5s ease-in-out infinite;
}
.sparkle { position: absolute; height: 2px; border-radius: 2px; background: var(--glint); opacity: 0; animation: twinkle 5s ease-in-out infinite; }
.shore { position: absolute; left: 0; right: 0; bottom: 0; height: 18%; }
.shore svg { width: 100%; height: 100%; display: block; }
.shore .foam { fill: none; stroke: var(--foam); stroke-width: 4; animation: wash 7s ease-in-out infinite; }
.palm { position: absolute; bottom: -1%; aspect-ratio: 400 / 640; transform-origin: 35% 100%; animation: lean 11s ease-in-out infinite; }
.palm.left { left: -150px; height: min(92vh, 820px); }
.palm.right { right: -170px; height: min(76vh, 680px); animation-duration: 13s; animation-delay: -4s; }
.palm.right > svg { transform: scaleX(-1); }
.palm svg { width: 100%; height: 100%; overflow: visible; }
.palm .crown { animation: sway 7s ease-in-out infinite; transform-box: view-box; }
.palm.right .crown { animation-duration: 8.5s; }
.fb { fill: var(--frond-back); } .ff { fill: var(--frond-front); }
.spine { fill: none; stroke: var(--spine); stroke-width: 2.4; stroke-linecap: round; }
.trunk { fill: url(#trunkGrad); } .ring { fill: none; stroke: var(--ring); stroke-width: 1.6; opacity: .45; stroke-linecap: round; }
.coco { fill: var(--coco); }
@media (max-width: 700px) {
  :root { --horizon: 46%; }
  .palm.left { left: -190px; height: 64vh; }
  .palm.right { right: -210px; height: 52vh; }
  .sun { left: 78%; }
  .glint { left: 78%; }
  .island { left: -10px; width: 150px; }
}
@keyframes drift { from { transform: translateX(-40vw); } to { transform: translateX(130vw); } }
@keyframes flap { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.4); } }
@keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
@keyframes shimmer { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
@keyframes wash { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
@keyframes sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.8deg); } }
@keyframes lean { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(.8deg); } }

/* ---------- App layout ---------- */
.app { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom)); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 14px; position: relative; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 600; font-size: 1.4rem; letter-spacing: .2px; }
.brand svg { width: 34px; height: 34px; }
.brand small { font-weight: 500; color: var(--muted); font-size: 1.05rem; }
.layout { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.colA, .colB { display: contents; }
.tabs { order: 1; } .stage { order: 2; } .actionBar { order: 3; } .controls { order: 4; } .history { order: 5; }

.card { background: var(--card); border: 1px solid var(--card-line); border-radius: var(--r-lg); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); }
.cardHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 0; }
.cardTitle { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; }

.iconBtn { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--card-line); background: var(--card); color: var(--ink); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transition: background .2s, transform .15s; }
.iconBtn:hover { background: var(--card-strong); }
.iconBtn:active { transform: scale(.94); }
.stage .iconBtn { width: 40px; height: 40px; background: transparent; border-color: transparent; color: var(--muted); }
.stage .iconBtn:hover { background: var(--teal-soft); color: var(--teal); }
.textBtn { border: 0; background: none; color: var(--teal); font-weight: 700; padding: 8px 10px; border-radius: 10px; }
.textBtn:hover { background: var(--teal-soft); }

/* ---------- Mode tabs ---------- */
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 5px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 58px; justify-content: center; padding: 8px 2px; border: 0; border-radius: 18px; background: transparent; color: var(--muted); font-weight: 700; font-size: .8rem; transition: background .2s, color .2s, box-shadow .2s; }
.tab svg.icon { width: 22px; height: 22px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--card-strong); color: var(--teal); box-shadow: 0 6px 16px -8px rgba(10, 60, 80, .4); }

/* ---------- Stage ---------- */
.stage { display: flex; flex-direction: column; overflow: hidden; }
.stageHead { display: flex; align-items: center; justify-content: space-between; padding: 10px 8px 0 18px; }
.stageTitle { margin: 0; font-size: .82rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stageTools { display: flex; gap: 2px; }
.stageBody { min-height: clamp(210px, 32vh, 300px); display: flex; flex-wrap: wrap; align-content: center; align-items: center; justify-content: center; gap: 14px; padding: 18px 18px 8px; }
.caption { margin: 0; padding: 4px 18px 18px; min-height: 2.9em; text-align: center; font-weight: 700; color: var(--muted); overflow-wrap: anywhere; }
.caption strong { color: var(--ink); }
.caption.warn { color: var(--coral-deep); }
[data-theme="dark"] .caption.warn { color: var(--coral); }
.note { display: block; font-size: .85rem; font-weight: 600; margin-top: 2px; }

/* Coin */
.coinWrap { --cs: 150px; position: relative; width: var(--cs); height: var(--cs); perspective: 800px; cursor: pointer; -webkit-user-select: none; user-select: none; }
.coinToss { position: absolute; inset: 0; transform-style: preserve-3d; }
.coin { position: absolute; inset: 0; transform-style: preserve-3d; }
.coinEdge { position: absolute; inset: 1%; border-radius: 50%; background: #b3761a; }
.coinEdge:nth-child(even) { background: #dca03a; }
.face { position: absolute; inset: 0; border-radius: 50%; -webkit-backface-visibility: hidden; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3%; padding: 22% 20% 16%; text-align: center; }
.face.front { color: #7a4a06; }
.face.back { color: #0c524d; }
.face .art { position: absolute; inset: 0; width: 100%; height: 100%; }
.face::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(135deg, rgba(255, 255, 255, .5) 0%, rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, .18) 100%); pointer-events: none; }
.face .emb { position: relative; width: 30%; height: 30%; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 0 rgba(255, 255, 255, .7)); }
.face .lbl { position: relative; max-width: 100%; font-family: var(--font-display); font-weight: 700; font-size: calc(var(--cs) * .135); line-height: 1.05; text-shadow: 0 1px 0 rgba(255, 255, 255, .65); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.coinWrap.small .lbl { display: none; }
.coinWrap.small .emb { width: 44%; height: 44%; }
.coinWrap.small .face { padding: 0; }
.coinShadow { position: absolute; left: 14%; right: 14%; bottom: -13%; height: 10%; border-radius: 50%; background: rgba(0, 30, 40, .25); filter: blur(4px); }
.coinWrap:hover .coin { transition: translate .2s; translate: 0 -3px; }
/* At rest the coin is drawn flat: Safari flattens 3D inside the card's rounded clip,
   which would hide both faces. Only the tossing coin uses real 3D. */
.coin.rest { transform: none !important; }
.coin.rest .coinEdge { display: none; }
.coin.rest .face { transform: none !important; box-shadow: 0 calc(var(--cs) * .04) 0 #b3761a; }
.coin.rest[data-face="heads"] .back, .coin.rest[data-face="tails"] .front { display: none; }
.stage.tossing { overflow: visible; }
.tally { flex-basis: 100%; display: grid; gap: 6px; max-width: 420px; }
.tallyBar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--line); }
.tallyBar span { transition: flex-grow .7s cubic-bezier(.3, 1.3, .5, 1); }
.tallyBar .h { background: linear-gradient(180deg, #ffd46b, #e9a425); }
.tallyBar .t { background: linear-gradient(180deg, #8fe0d6, #3b9f96); }
.tallyLabels { display: flex; justify-content: space-between; font-weight: 800; font-size: .9rem; }
.tallyLabels span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 48%; }

/* Dice */
.dieWrap { --ds: 104px; width: var(--ds); height: var(--ds); filter: drop-shadow(0 8px 10px rgba(0, 30, 40, .22)); }
.die { width: 100%; height: 100%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: calc(var(--ds) * .36); color: #fff; }
.die.d6 { grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 16%; border-radius: 22%; background: linear-gradient(145deg, #ffffff, #e9f1f2); box-shadow: inset 0 -5px 0 rgba(15, 52, 64, .08); }
.pip { width: 72%; aspect-ratio: 1; border-radius: 50%; background: #13414e; opacity: 0; }
.pip.on { opacity: 1; }
.die.poly { clip-path: var(--shape); background: var(--dc); }
.die.d4 { --shape: polygon(50% 3%, 98% 94%, 2% 94%); --dc: linear-gradient(160deg, #ff9a76, #e2542c); padding-top: 26%; }
.die.d8 { --shape: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); --dc: linear-gradient(160deg, #3fd3c4, #0b8f84); }
.die.d10 { --shape: polygon(50% 0, 100% 42%, 50% 100%, 0 42%); --dc: linear-gradient(160deg, #6fb7ff, #2f6fd1); }
.die.d12 { --shape: polygon(50% 0, 100% 37%, 81% 97%, 19% 97%, 0 37%); --dc: linear-gradient(160deg, #6ed38f, #2b8f55); padding-top: 8%; }
.die.d20 { --shape: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0 50%); --dc: linear-gradient(160deg, #ffc24b, #f36b43 60%, #c2416b); }
.die.dx { --shape: inset(0 round 22%); --dc: linear-gradient(160deg, #7b8fd6, #4b5aa8); }
.die.small-text { font-size: calc(var(--ds) * .26); }
.rolling { animation: tumble .32s ease-in-out infinite; }
@keyframes tumble { 0% { transform: rotate(0) translateY(0); } 25% { transform: rotate(-14deg) translateY(-8%); } 50% { transform: rotate(8deg) translateY(0); } 75% { transform: rotate(16deg) translateY(-5%); } 100% { transform: rotate(0) translateY(0); } }
.land { animation: land .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes land { 0% { transform: scale(.82); } 100% { transform: scale(1); } }

/* Numbers and text results */
.bigNum { font-family: var(--font-display); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; color: var(--ink); text-align: center; overflow-wrap: anywhere; }
.bigNum.xl { font-size: clamp(4rem, 20vw, 6.5rem); }
.bigNum.lg { font-size: clamp(2.6rem, 12vw, 4rem); }
.bigNum.md { font-size: clamp(1.8rem, 7vw, 2.6rem); }
.bigNum.sm { font-size: 1.4rem; }
.pill { min-width: 3.2em; padding: 10px 14px; border-radius: 14px; background: var(--card-strong); border: 1px solid var(--line); font-family: var(--font-display); font-weight: 600; font-size: 1.35rem; text-align: center; font-variant-numeric: tabular-nums; box-shadow: 0 6px 14px -10px rgba(10, 60, 80, .5); }
.pills.many .pill { font-size: 1.05rem; padding: 7px 10px; min-width: 2.8em; }
.muted { color: var(--muted); }

/* Yes / No orb */
.orb {
  width: 164px; height: 164px; border-radius: 50%; display: grid; place-items: center; padding: 18px; text-align: center;
  font-family: var(--font-display); font-weight: 700; font-size: 1.9rem; line-height: 1.05; color: #fff; overflow-wrap: anywhere;
  background: radial-gradient(circle at 34% 28%, #ffffff 0%, #bfe9f0 22%, #5fbdd0 60%, #2b87a3 100%);
  box-shadow: 0 0 0 8px rgba(255, 255, 255, .25), 0 18px 40px -14px rgba(20, 90, 120, .6); text-shadow: 0 1px 2px rgba(0, 0, 0, .25);
  transition: background .4s, box-shadow .4s;
}
.orb.long { font-size: 1.3rem; }
.orb.yes { background: radial-gradient(circle at 34% 28%, #ffffff 0%, #b9f5e6 22%, #3fcfae 58%, #10866d 100%); box-shadow: 0 0 0 8px rgba(63, 207, 174, .25), 0 0 60px rgba(63, 207, 174, .55); }
.orb.no { background: radial-gradient(circle at 34% 28%, #ffffff 0%, #ffd6c4 22%, #ff8a63 58%, #cc4a24 100%); box-shadow: 0 0 0 8px rgba(255, 138, 99, .25), 0 0 60px rgba(255, 138, 99, .55); }
.orb.thinking { animation: breathe 1s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(1); filter: brightness(1); } 50% { transform: scale(1.06); filter: brightness(1.12); } }

/* List picks */
.pickCard { max-width: 100%; padding: 22px 26px; border-radius: 20px; background: var(--card-strong); border: 1px solid var(--line); box-shadow: 0 14px 30px -18px rgba(10, 60, 80, .6); font-family: var(--font-display); font-weight: 600; text-align: center; overflow-wrap: anywhere; line-height: 1.15; }
.pickCard.xl { font-size: clamp(2.2rem, 10vw, 3.2rem); }
.pickCard.lg { font-size: clamp(1.7rem, 7vw, 2.4rem); }
.pickCard.md { font-size: 1.45rem; }
.pickCard.sm { font-size: 1.1rem; }
.pickCard.placeholder { font-family: var(--font-body); font-size: 1.05rem; font-weight: 700; color: var(--muted); box-shadow: none; border-style: dashed; background: transparent; }
.listStage { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
.reel { --row: 52px; position: relative; width: min(100%, 360px); height: calc(var(--row) * 5); perspective: 700px; }
.reelWindow { position: absolute; inset: 0; overflow: hidden; -webkit-mask-image: linear-gradient(transparent, #000 26%, #000 74%, transparent); mask-image: linear-gradient(transparent, #000 26%, #000 74%, transparent); }
.reelBand { position: absolute; left: 0; right: 0; top: 50%; height: var(--row); margin-top: calc(var(--row) / -2); border-radius: 18px; background: var(--teal-soft); border: 2px solid var(--teal); }
.reelBand::before, .reelBand::after { content: ""; position: absolute; top: 50%; margin-top: -9px; border: 9px solid transparent; }
.reelBand::before { left: -4px; border-left: 12px solid var(--coral); }
.reelBand::after { right: -4px; border-right: 12px solid var(--coral); }
.reelRow {
  position: absolute; left: 14px; right: 14px; top: 50%; height: calc(var(--row) - 8px); margin-top: calc((var(--row) - 8px) / -2);
  display: flex; align-items: center; gap: 10px; padding: 0 16px; border-radius: 14px; font-weight: 800; font-size: 1.1rem;
  background: color-mix(in srgb, var(--c) 20%, var(--card-strong)); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  -webkit-backface-visibility: hidden; backface-visibility: hidden; will-change: transform, opacity;
}
.reelRow .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
.reelRow .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reelRow.taken { filter: grayscale(1); }
.reelRow.taken .txt { text-decoration: line-through; }
.reelRow.win { background: var(--c); border-color: var(--c); color: #0f2a33; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 35%, transparent), 0 12px 30px -8px var(--c); animation: winPop .5s cubic-bezier(.3, 1.6, .5, 1); }
.reelRow.win .dot { background: #fff; }
@keyframes winPop { 0% { scale: .92; } 100% { scale: 1; } }
.confetti { position: absolute; left: 50%; top: 50%; width: 8px; height: 12px; margin: -6px 0 0 -4px; border-radius: 2px; pointer-events: none; }
.pickTray { width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 38px; }
.trayPill { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 5px 14px 5px 5px; border-radius: 999px; font-weight: 800; background: color-mix(in srgb, var(--c) 22%, var(--card-strong)); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); animation: tagIn .35s cubic-bezier(.3, 1.6, .5, 1); }
.trayPill b { flex: none; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--c); color: #0f2a33; font-size: .8rem; }
.trayPill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

/* ---------- Controls ---------- */
.panelBody { padding: 14px 16px 18px; display: grid; gap: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .fieldLabel { font-size: .85rem; font-weight: 700; color: var(--muted); }
.input, textarea.input {
  width: 100%; min-height: 48px; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid var(--field-line); background: var(--field);
  font-size: 1rem; outline: none; transition: border-color .2s, box-shadow .2s;
}
textarea.input { min-height: 132px; resize: vertical; line-height: 1.5; }
.input:focus { border-color: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
.input::placeholder { color: var(--muted); opacity: .75; }
.stepper { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; border: 1px solid var(--field-line); border-radius: var(--r-sm); background: var(--field); overflow: hidden; }
.stepper:focus-within { border-color: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
.stepper button { border: 0; background: transparent; font-size: 1.35rem; font-weight: 700; color: var(--teal); min-height: 46px; }
.stepper button:hover { background: var(--teal-soft); }
.stepper input { border: 0; background: transparent; text-align: center; font-weight: 800; font-size: 1.05rem; min-width: 0; outline: none; -moz-appearance: textfield; }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipOpt { position: relative; }
.chipOpt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chipOpt span { display: inline-flex; align-items: center; min-height: 42px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--field-line); background: var(--field); font-weight: 800; transition: background .15s, color .15s, border-color .15s; }
.chipOpt input:checked + span { background: var(--teal); border-color: var(--teal); color: #fff; }
[data-theme="dark"] .chipOpt input:checked + span { color: #062a2a; }
.chipOpt input:focus-visible + span { outline: 3px solid var(--teal); outline-offset: 2px; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; font-weight: 700; cursor: pointer; }
.switch input { appearance: none; -webkit-appearance: none; flex: none; width: 50px; height: 30px; margin: 0; border-radius: 999px; background: var(--field-line); position: relative; cursor: pointer; transition: background .2s; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .2s; }
.switch input:checked { background: var(--teal); }
.switch input:checked::after { transform: translateX(20px); }
.hint { font-size: .85rem; color: var(--muted); margin: 0; }
.tagBox { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 56px; padding: 8px; border: 1px solid var(--field-line); border-radius: var(--r-sm); background: var(--field); cursor: text; transition: border-color .2s, box-shadow .2s; }
.tagBox:focus-within { border-color: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
.tag { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; padding: 2px 2px 2px 12px; border-radius: 999px; font-weight: 800; font-size: .95rem; cursor: default; background: color-mix(in srgb, var(--c) 22%, var(--card-strong)); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); animation: tagIn .28s cubic-bezier(.3, 1.6, .5, 1); }
.tag .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag button { flex: none; width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 1.15rem; line-height: 1; }
.tag button:hover { background: color-mix(in srgb, var(--c) 35%, transparent); color: var(--ink); }
.tagEntry { display: flex; flex: 1 1 160px; min-width: 0; align-items: center; gap: 6px; }
.tagInput { flex: 1; min-width: 0; min-height: 36px; border: 0; background: transparent; outline: none; padding: 4px 6px; font-size: 1rem; }
.tagInput::placeholder { color: var(--muted); opacity: .75; }
.addBtn { flex: none; min-height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--teal); color: #fff; font-weight: 800; }
[data-theme="dark"] .addBtn { color: #062a2a; }
.hintRow { display: flex; justify-content: space-between; align-items: center; min-height: 28px; }
.hintRow .textBtn { padding: 4px 8px; font-size: .85rem; }
@keyframes tagIn { from { scale: .5; opacity: 0; } to { scale: 1; opacity: 1; } }
.savedLists { display: flex; flex-wrap: wrap; gap: 8px; }
.savedList { display: inline-flex; align-items: center; border-radius: 999px; background: var(--teal-soft); color: var(--teal); font-weight: 800; }
.savedList button { border: 0; background: none; color: inherit; min-height: 38px; }
.savedList .load { padding: 6px 4px 6px 14px; }
.savedList .del { padding: 6px 12px 6px 6px; opacity: .7; }
.savedList .del:hover { opacity: 1; }
.saveRow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.smallBtn { border: 1px solid var(--field-line); background: var(--field); border-radius: var(--r-sm); padding: 0 16px; font-weight: 800; color: var(--teal); min-height: 48px; }
.smallBtn:hover { background: var(--teal-soft); }

/* ---------- History ---------- */
.historyList { list-style: none; margin: 0; padding: 8px 8px 12px; max-height: 360px; overflow: auto; }
.historyList li { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; }
.historyList li + li { border-top: 1px solid var(--line); }
.hIcon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px; background: var(--teal-soft); color: var(--teal); }
.hIcon svg.icon { width: 18px; height: 18px; }
.hText { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hSub { font-size: .8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hTime { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.empty { display: grid; justify-items: center; gap: 6px; padding: 22px 16px 26px; text-align: center; color: var(--muted); font-weight: 600; }
.empty svg { width: 44px; height: 44px; opacity: .7; }

/* ---------- Action bar ---------- */
.actionBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 12px 16px max(14px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, transparent, rgba(0, 20, 30, .12)); }
.go {
  display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 560px; margin: 0 auto; min-height: 60px; padding: 14px 24px;
  border: 0; border-radius: 999px; color: #fff; font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; letter-spacing: .2px;
  background: linear-gradient(180deg, #ff8a5c 0%, var(--coral) 45%, var(--coral-deep) 100%);
  box-shadow: 0 14px 30px -12px rgba(217, 74, 32, .7), inset 0 1px 0 rgba(255, 255, 255, .35); text-shadow: 0 1px 1px rgba(120, 30, 0, .35);
  transition: transform .15s, box-shadow .15s, filter .2s;
}
.go:hover { filter: brightness(1.05); }
.go:active, .go.busy { transform: translateY(2px) scale(.99); box-shadow: 0 8px 18px -10px rgba(217, 74, 32, .7), inset 0 1px 0 rgba(255, 255, 255, .35); }
.go svg.icon { width: 22px; height: 22px; }
.kbdHint { display: none; text-align: center; font-size: .8rem; color: var(--muted); margin-top: 8px; font-weight: 600; }
kbd { font-family: inherit; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--field-line); background: var(--field); }

/* ---------- Settings popover & toast ---------- */
.popover { position: absolute; right: 0; top: calc(100% - 4px); z-index: 20; width: min(300px, calc(100vw - 32px)); padding: 10px 16px 14px; background: var(--card-strong); }
.popover h2 { margin: 6px 0 4px; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.popover .chips { margin: 6px 0 2px; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 30; transform: translate(-50%, 12px); padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--sky2); font-weight: 800; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
[data-theme="dark"] .toast { color: #0a1a2e; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Desktop ---------- */
@media (min-width: 900px) {
  .app { padding: 20px 32px 40px; }
  .layout { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; gap: 20px; }
  .colA, .colB { display: grid; gap: 16px; }
  .colA { position: sticky; top: 20px; }
  .stageBody { min-height: 340px; }
  .actionBar { position: static; padding: 0; background: none; }
  .kbdHint { display: block; }
  .toast { bottom: 40px; }
}
@media (hover: none) { .kbdHint { display: none !important; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];
  const STORE_KEY = 'serenity:v1';
  const HISTORY_MAX = 50;
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const wait = (ms) => new Promise((r) => setTimeout(r, reducedMotion.matches ? 0 : ms));
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));
  const int = (v, fallback) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : fallback; };

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function icon(id) {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('class', 'icon');
    const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
    u.setAttribute('href', '#' + id);
    s.append(u);
    return s;
  }
  function sizeClass(text) {
    const n = String(text).length;
    return n <= 6 ? 'xl' : n <= 14 ? 'lg' : n <= 32 ? 'md' : 'sm';
  }

  /* ---------- Randomness (crypto-backed, unbiased) ---------- */
  function randInt(min, max) {
    const range = max - min + 1;
    if (range <= 1) return min;
    if (range <= 0x100000000 && window.crypto && crypto.getRandomValues) {
      const buf = new Uint32Array(1);
      const limit = Math.floor(0x100000000 / range) * range;
      do crypto.getRandomValues(buf); while (buf[0] >= limit);
      return min + (buf[0] % range);
    }
    return min + Math.floor(Math.random() * range);
  }
  const pick = (arr) => arr[randInt(0, arr.length - 1)];

  function uniqueInts(min, max, count) {
    const range = max - min + 1;
    if (count > range / 2) {
      // Small range: partial Fisher–Yates over the whole range.
      const all = Array.from({ length: range }, (_, i) => min + i);
      for (let i = 0; i < count; i++) {
        const j = randInt(i, range - 1);
        [all[i], all[j]] = [all[j], all[i]];
      }
      return all.slice(0, count);
    }
    const seen = new Set();
    while (seen.size < count) seen.add(randInt(min, max));
    return [...seen];
  }

  /* ---------- Persistence ---------- */
  let store = { mode: 'coin', fields: {}, history: [], lists: {} };
  try { Object.assign(store, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch (_) {}
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (_) {}
  }
  const persisted = $$('[data-persist]');
  for (const input of persisted) {
    const key = input.type === 'radio' ? input.name : input.id;
    if (!(key in store.fields)) continue;
    const v = store.fields[key];
    if (input.type === 'radio') input.checked = input.value === v;
    else if (input.type === 'checkbox') input.checked = !!v;
    else input.value = v;
  }
  function saveField(input) {
    if (!input.matches('[data-persist]')) return;
    if (input.type === 'radio') store.fields[input.name] = input.value;
    else if (input.type === 'checkbox') store.fields[input.id] = input.checked;
    else store.fields[input.id] = input.value;
    save();
  }
  const radio = (name) => ($(`input[name="${name}"]:checked`) || {}).value;

  /* ---------- Theme ---------- */
  const darkQuery = matchMedia('(prefers-color-scheme: dark)');
  function applyTheme() {
    const pref = radio('theme') || 'auto';
    const dark = pref === 'dark' || (pref === 'auto' && darkQuery.matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('meta[name="theme-color"]').content = dark ? '#060d26' : '#5dbfdc';
  }
  darkQuery.addEventListener?.('change', applyTheme);
  applyTheme();

  /* ---------- Sound ---------- */
  let ac = null;
  function audio() {
    if (!$('#soundToggle').checked) return null;
    try {
      if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ac = new C(); }
      if (ac.state === 'suspended') ac.resume().catch(() => {});
      return ac;
    } catch (_) { return null; }
  }
  // Soft marimba-like note: sine body plus a quickly decaying overtone.
  function note(freq, delay = 0, dur = 0.6, vol = 0.12) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + 0.01 + delay;
    for (const [mult, v, d] of [[1, vol, dur], [4, vol * 0.18, dur * 0.25]]) {
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * mult, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(v, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(a.destination);
      o.start(t); o.stop(t + d + 0.05);
    }
  }
  // Bell-like metallic ping with inharmonic partials, for the coin.
  function metal(delay, vol, base) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + 0.01 + delay;
    for (const [ratio, amp, d] of [[1, 1, 0.5], [2.76, 0.5, 0.3], [5.4, 0.25, 0.16], [8.93, 0.12, 0.09]]) {
      const o = a.createOscillator(), g = a.createGain();
      o.frequency.value = base * ratio;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol * amp, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g).connect(a.destination);
      o.start(t); o.stop(t + d + 0.05);
    }
  }
  function whoosh(delay, dur, vol = 0.05) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + 0.01 + delay, len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.Q.value = 0.9;
    f.frequency.setValueAtTime(500, t); f.frequency.exponentialRampToValueAtTime(1800, t + dur * 0.4); f.frequency.exponentialRampToValueAtTime(450, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.35); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(a.destination); src.start(t);
  }
  function clack(vol = 0.18) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + 0.005, len = Math.floor(a.sampleRate * 0.04);
    const buf = a.createBuffer(1, len, a.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    src.buffer = buf; f.type = 'bandpass'; f.frequency.value = 1800 + Math.random() * 1400; f.Q.value = 1.4; g.gain.value = vol;
    src.connect(f).connect(g).connect(a.destination); src.start(t);
  }
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66];
  const tick = () => note(pick(PENTA), 0, 0.12, 0.035);
  const chime = () => { note(523.25, 0, 0.9, 0.1); note(659.25, 0.07, 0.9, 0.08); note(783.99, 0.14, 1.1, 0.08); };
  function buzz(pattern) {
    if (!$('#hapticToggle').checked || !('vibrate' in navigator)) return;
    try { navigator.vibrate(pattern); } catch (_) {}
  }

  /* ---------- Animation helper ---------- */
  // Calls onStep with slowing cadence for `duration` ms, like a wheel winding down.
  function spin(duration, onStep) {
    return new Promise((resolve) => {
      if (reducedMotion.matches) return resolve();
      const start = performance.now();
      (function step() {
        const p = (performance.now() - start) / duration;
        if (p >= 1) return resolve();
        onStep(p);
        setTimeout(step, 45 + 170 * p * p);
      })();
    });
  }
  function landIn(node) {
    node.classList.remove('land');
    void node.offsetWidth;
    node.classList.add('land');
  }

  /* ---------- Modes ---------- */
  const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

  const SVGNS = 'http://www.w3.org/2000/svg';
  function svgUse(cls, id) {
    const s = document.createElementNS(SVGNS, 'svg'), u = document.createElementNS(SVGNS, 'use');
    s.setAttribute('class', cls);
    s.setAttribute('viewBox', id.startsWith('coin-') ? '0 0 200 200' : '0 0 24 24');
    u.setAttribute('href', '#' + id);
    s.append(u);
    return s;
  }
  // A minted coin with real thickness: stacked edge discs between two faces.
  // It flips end over end (rotateX); 0deg shows heads, 180deg shows tails.
  function coinNode(heads, tails, size) {
    const wrap = el('div', 'coinWrap' + (size < 80 ? ' small' : ''));
    wrap.style.setProperty('--cs', size + 'px');
    const toss = el('div', 'coinToss'), coin = el('div', 'coin');
    const thick = Math.max(4, size * 0.075), layers = size >= 100 ? 10 : 5;
    for (let i = 0; i < layers; i++) {
      const e = el('div', 'coinEdge');
      e.style.transform = `translateZ(${(-thick / 2 + (thick * i) / (layers - 1)).toFixed(2)}px)`;
      coin.append(e);
    }
    const face = (cls, art, emb, label, z) => {
      const f = el('div', 'face ' + cls);
      f.style.transform = z;
      f.append(svgUse('art', art), svgUse('emb', emb), el('span', 'lbl', label));
      return f;
    };
    coin.append(
      face('front', 'coin-heads', 'i-sun', heads, `translateZ(${thick / 2}px)`),
      face('back', 'coin-tails', 'i-palm', tails, `rotateX(180deg) translateZ(${thick / 2}px)`),
    );
    toss.append(coin);
    wrap.append(el('div', 'coinShadow'), toss);
    return wrap;
  }
  // Which face each coin last showed, so the next toss starts from it.
  const coinShowing = [];
  function restCoin(coin, deg) {
    coin.style.transform = `rotateX(${deg}deg)`;
    coin.dataset.face = deg === 0 ? 'heads' : 'tails';
    coin.classList.add('rest');
  }

  function dieNode(sides, value, size) {
    const wrap = el('div', 'dieWrap');
    wrap.style.setProperty('--ds', size + 'px');
    const shape = { 4: 'd4', 8: 'd8', 10: 'd10', 12: 'd12', 20: 'd20' }[sides] || 'dx';
    const die = el('div', sides === 6 ? 'die d6' : 'die poly ' + shape);
    if (sides === 6) for (let i = 0; i < 9; i++) die.append(el('span', 'pip'));
    wrap.append(die);
    setDie(wrap, sides, value);
    return wrap;
  }
  function setDie(wrap, sides, value) {
    const die = wrap.firstChild;
    if (sides === 6) [...die.children].forEach((p, i) => p.classList.toggle('on', PIPS[value].includes(i)));
    else { die.textContent = value; die.classList.toggle('small-text', String(value).length > 2); }
  }
  const diceSize = (n) => (n === 1 ? 112 : n <= 3 ? 86 : n <= 6 ? 66 : n <= 12 ? 52 : 42);

  /* ---------- List reel ---------- */
  const TAG_COLORS = ['#ff8a63', '#2fc1b3', '#ffc24b', '#5aa7ff', '#5fcf8a', '#c79bff', '#ff7fb0'];
  const tagColor = (i) => TAG_COLORS[i % TAG_COLORS.length];

  // A vertical drum of pills; pos is a (fractional) item index at the centre band.
  function makeReel(items) {
    const n = items.length, root = el('div', 'reel'), win = el('div', 'reelWindow'), rows = [];
    root.setAttribute('aria-hidden', 'true');
    root.append(el('div', 'reelBand'), win);
    for (let j = 0; j < 7; j++) {
      const row = el('div', 'reelRow');
      row.append(el('span', 'dot'), el('span', 'txt'));
      win.append(row); rows.push(row);
    }
    const rowH = 52, taken = new Set();
    let pos = 0;
    const mod = (k) => ((k % n) + n) % n;
    function setPos(p) {
      pos = p;
      const base = Math.round(p);
      rows.forEach((row, j) => {
        const k = base + j - 3, d = k - p, i = mod(k), ad = Math.min(Math.abs(d), 3);
        if (row._i !== i) { row._i = i; row.lastChild.textContent = items[i]; row.style.setProperty('--c', tagColor(i)); }
        row.classList.toggle('taken', taken.has(i));
        row.classList.remove('win');
        row.style.transform = `translateY(${(d * rowH).toFixed(1)}px) rotateX(${(-d * 18).toFixed(1)}deg) scale(${(1 - ad * 0.06).toFixed(3)})`;
        row.style.opacity = Math.max(0, 1 - ad * 0.3).toFixed(2);
      });
    }
    function spinTo(target, duration, loops) {
      const start = pos, base = Math.round(start) + Math.max(n * loops, 12);
      const end = base + mod(target - base);
      let lastRow = Math.round(start), lastTick = 0;
      return new Promise((resolve) => {
        const t0 = performance.now();
        (function frame(now) {
          const t = Math.min(1, (now - t0) / duration), e = 1 - Math.pow(1 - t, 4);
          setPos(start + (end - start) * e);
          const r = Math.round(pos);
          if (r !== lastRow) {
            lastRow = r;
            if (now - lastTick > 40) { lastTick = now; tick(); if (t > 0.6) buzz(3); }
          }
          if (t < 1) requestAnimationFrame(frame); else { setPos(end); resolve(); }
        })(t0);
      });
    }
    return {
      el: root, setPos, spinTo,
      take(i) { taken.add(i); setPos(pos); },
      win() { const row = rows[3]; row.classList.remove('taken'); void row.offsetWidth; row.classList.add('win'); },
    };
  }

  function burst(host) {
    if (reducedMotion.matches || !host.animate) return;
    for (let i = 0; i < 28; i++) {
      const c = el('span', 'confetti');
      c.style.background = TAG_COLORS[i % TAG_COLORS.length];
      host.append(c);
      const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 110;
      const x = Math.cos(a) * d * 1.4, y = Math.sin(a) * d * 0.8 - 30;
      c.animate([
        { transform: 'translate(0,0) rotate(0) scale(.6)', opacity: 1 },
        { transform: `translate(${x}px, ${y}px) rotate(${Math.random() * 540 - 270}deg) scale(1)`, opacity: 1, offset: 0.55 },
        { transform: `translate(${x * 1.1}px, ${y + 90}px) rotate(${Math.random() * 720}deg) scale(.9)`, opacity: 0 },
      ], { duration: 1100 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => c.remove();
    }
  }

  const MODES = {
    coin: {
      title: 'Coin flip', icon: 'i-coin',
      opts() {
        return { heads: $('#coinHeads').value.trim() || 'Heads', tails: $('#coinTails').value.trim() || 'Tails', n: clamp(int($('#coinCount').value, 1), 1, 20) };
      },
      goLabel() { const { n } = this.opts(); return n > 1 ? `Flip ${n} coins` : 'Flip the coin'; },
      idle(body) {
        const { heads, tails } = this.opts();
        const w = coinNode(heads, tails, 150);
        restCoin(w.querySelector('.coin'), coinShowing[0] || 0);
        body.append(w);
        return `${heads} or ${tails}? Tap the coin to flip.`;
      },
      compute() {
        const { heads, tails, n } = this.opts();
        const flips = Array.from({ length: n }, () => randInt(0, 1) === 0);
        const h = flips.filter(Boolean).length;
        let streak = '';
        if (n === 1) {
          const label = flips[0] ? heads : tails;
          let run = 1;
          for (const e of store.history) { if (e.m === 'coin' && e.sub === 'Coin' && e.text === label) run++; else break; }
          if (run >= 2) streak = `${label} ${run} times in a row`;
        }
        return {

      async render(body, r, animate) {

            { transform: `rotateX(${end + 10}deg) rotateY(8deg)`, offset: 0.8 },
            { transform: `rotateX(${end - 5}deg) rotateY(-5deg)`, offset: 0.88 },

            metal(s + D * 0.9 / 1000, 0.035 * v, 1520 + Math.random() * 80);
            metal(s + D * 0.96 / 1000, 0.012 * v, 1560);

    dice: {

  /* ---------- Stage ---------- */
  const body = $('#stageBody'), caption = $('#caption');
  const lastResult = {};
  let mode = MODES[store.mode] ? store.mode : 'coin';
  let busy = false;

  function setCaption(parts, note, warn) {
    caption.replaceChildren();
    caption.classList.toggle('warn', !!warn);
    if (typeof parts === 'string') caption.append(parts);
    else for (const [plain, strong] of parts) { caption.append(plain); if (strong) caption.append(el('strong', '', strong)); }
    if (note) caption.append(el('span', 'note', note));
  }
  function setShareable(on) { $('#copyBtn').disabled = !on; $('#shareBtn').disabled = !on; }

  function showIdle() {
    body.replaceChildren();
    const r = lastResult[mode];
    if (r) { MODES[mode].render(body, r, false); setCaption(r.caption, r.note); setShareable(true); }
    else { setCaption(MODES[mode].idle(body)); setShareable(false); }
  }

  function updateGoLabel() {
    $('#goLabel').textContent = MODES[mode].goLabel();
    $('#goIcon').setAttribute('href', '#' + MODES[mode].icon);
  }

  function setMode(m, focus) {
    mode = m;
    store.mode = m; save();
    for (const t of $$('.tab')) {
      const on = t.dataset.mode === m;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
      if (on && focus) t.focus();
    }
    for (const p of $$('[data-panel]')) p.hidden = p.dataset.panel !== m;
    $('#stageTitle').textContent = MODES[m].title;
    updateGoLabel();
    showIdle();
  }

  async function perform() {
    if (busy) return;
    const m = MODES[mode];
    if (mode === 'list') commitDraft();
    const r = m.compute();
    if (r.error) {
      setCaption(r.error, '', true);
      body.classList.remove('shake'); void body.offsetWidth; body.classList.add('shake');
      buzz([20, 40, 20]);
      if (mode === 'list') $('#listDraft').focus();
      return;
    }
    busy = true;
    $('#goBtn').classList.add('busy');
    setShareable(false);
    body.replaceChildren();
    setCaption('');
    try { await m.render(body, r, true); } catch (_) {}
    lastResult[mode] = r;
    setCaption(r.caption, r.note);
    setShareable(true);
    $('#live').textContent = `${m.title}: ${r.text}`;
    buzz(15);
    addHistory(mode, r);
    $('#goBtn').classList.remove('busy');
    busy = false;
  }

  /* ---------- History ---------- */
  function addHistory(m, r) {
    store.history.unshift({ m, text: r.text, sub: r.sub, t: Date.now() });
    store.history.length = Math.min(store.history.length, HISTORY_MAX);
    save();
    renderHistory();
  }
  function renderHistory() {
    const list = $('#historyList');
    const fmt = new Intl.DateTimeFormat([], { hour: 'numeric', minute: '2-digit' });
    list.replaceChildren(...store.history.map((h) => {
      const li = el('li');
      const ic = el('span', 'hIcon'); ic.append(icon((MODES[h.m] || MODES.coin).icon));
      const mid = el('div'); mid.style.minWidth = '0';
      mid.append(el('div', 'hText', h.text), el('div', 'hSub', h.sub || (MODES[h.m] || {}).title || ''));
      li.append(ic, mid, el('time', 'hTime', fmt.format(h.t)));
      li.title = h.text;
      return li;
    }));
    const empty = !store.history.length;
    $('#historyEmpty').hidden = !empty;
    list.hidden = empty;
    $('#clearHistoryBtn').hidden = empty;
  }
  $('#clearHistoryBtn').addEventListener('click', () => { store.history = []; save(); renderHistory(); toast('History cleared'); });

  /* ---------- Saved lists ---------- */
  function activeListName() {
    const text = $('#listItems').value.trim();

  }
  function renderSavedLists() {
    const wrap = $('#savedLists');

  $('#saveListBtn').addEventListener('click', () => {

    if (mode === 'list' && !busy) showIdle();

  }
  function addItems(texts) {

    if (clean.length) setItems([...MODES.list.items(), ...clean]);
  }
  function commitDraft() {
    const d = $('#listDraft');

  const draft = $('#listDraft');
  draft.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); commitDraft(); }

      const items = MODES.list.items();
      if (!items.length) return;

      draft.focus();

  draft.addEventListener('input', () => {

  });
  draft.addEventListener('paste', (e) => {
    const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    if (!/[\r\n]/.test(text)) return;
    e.preventDefault();
    addItems(text.split(/\r?\n/));
  });
  draft.addEventListener('blur', commitDraft);
  $('#addTagBtn').addEventListener('mousedown', (e) => e.preventDefault());
  $('#addTagBtn').addEventListener('click', () => { commitDraft(); draft.focus(); });
  $('#tagBox').addEventListener('click', (e) => { if (e.target === e.currentTarget) draft.focus(); });
  $('#clearTagsBtn').addEventListener('click', () => {
    const prev = MODES.list.items();
    setItems([]);
    toast(`Cleared ${prev.length} option${prev.length > 1 ? 's' : ''}`);
    draft.focus();
  });

  /* ---------- Copy / share / toast ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
  }
  function resultText() { const r = lastResult[mode]; return r ? r.text : ''; }
  $('#copyBtn').addEventListener('click', async () => {
    const text = resultText(); if (!text) return;
    try { await navigator.clipboard.writeText(text); toast('Copied'); }
    catch (_) {
      const ta = el('textarea'); ta.value = text; document.body.append(ta); ta.select();
      try { document.execCommand('copy'); toast('Copied'); } catch (__) { toast('Could not copy'); }
      ta.remove();
    }
  });
  if (navigator.share) {
    $('#shareBtn').hidden = false;
    $('#shareBtn').addEventListener('click', () => {
      const text = resultText(); if (!text) return;

    });

  /* ---------- Inputs ---------- */
  for (const btn of $$('.stepper button')) {
    btn.addEventListener('click', () => {
      const input = btn.parentElement.querySelector('input');
      const min = int(input.min, 1), max = int(input.max, 100);
      input.value = clamp(int(input.value, min) + int(btn.dataset.step, 0), min, max);
      input.dispatchEvent(new Event('input', { bubbles: true }));
    });
  }
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (!(t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement)) return;
    saveField(t);
    if (t.name === 'theme') applyTheme();
    if (t.name === 'dieType') $('#customSidesWrap').hidden = t.value !== 'custom';
    if (t.id === 'listDraft') return;
    if (t.closest('[data-panel]')) {
      updateGoLabel();

      if (!lastResult[mode]) showIdle();

  });
  // Clamp step counts when the user leaves the field.
  for (const input of $$('.stepper input')) {
    input.addEventListener('change', () => {
      input.value = clamp(int(input.value, int(input.min, 1)), int(input.min, 1), int(input.max, 100));
      saveField(input); updateGoLabel();
    });
  }
  $('#customSidesWrap').hidden = radio('dieType') !== 'custom';
  if (!('vibrate' in navigator)) $('#hapticRow').hidden = true;

  /* ---------- Tabs ---------- */
  const tabs = $$('.tab');
  tabs.forEach((t, i) => {
    t.addEventListener('click', () => setMode(t.dataset.mode));
    t.addEventListener('keydown', (e) => {
      const d = { ArrowRight: 1, ArrowLeft: -1, Home: -i, End: tabs.length - 1 - i }[e.key];
      if (d == null) return;
      e.preventDefault();
      setMode(tabs[(i + d + tabs.length) % tabs.length].dataset.mode, true);
    });
  });

  /* ---------- Settings popover ---------- */
  const panel = $('#settingsPanel'), gear = $('#settingsBtn');
  function toggleSettings(open) {
    panel.hidden = !open;
    gear.setAttribute('aria-expanded', String(open));
  }
  gear.addEventListener('click', () => toggleSettings(panel.hidden));
  document.addEventListener('click', (e) => { if (!panel.hidden && !panel.contains(e.target) && !gear.contains(e.target)) toggleSettings(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden) { toggleSettings(false); gear.focus(); } });

  /* ---------- Go ---------- */
  $('#goBtn').addEventListener('click', perform);
  $('#stageBody').addEventListener('click', (e) => { if (mode === 'coin' && e.target.closest('.coinWrap')) perform(); });
  window.addEventListener('keydown', (e) => {
    if (e.code !== 'Space' || e.repeat) return;
    if (e.target.closest('input, textarea, select, button, [contenteditable], [role="dialog"]')) return;
    e.preventDefault();
    perform();
  });

  /* ---------- Scene ---------- */
  function rng(seed) {
    return () => {
      seed = (seed + 0x6d2b79f5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const f1 = (n) => n.toFixed(1);

  // Procedurally draws a coconut palm in a 400×640 box. Returns SVG markup.
  function palmMarkup(seed, lean) {
    const R = rng(seed);
    const B = [140, 640], C = [140 + lean, 170], K = [96, 420];
    const bez = (a, k, b, t) => [(1 - t) ** 2 * a[0] + 2 * (1 - t) * t * k[0] + t * t * b[0], (1 - t) ** 2 * a[1] + 2 * (1 - t) * t * k[1] + t * t * b[1]];
    const tan = (a, k, b, t) => { const x = 2 * (1 - t) * (k[0] - a[0]) + 2 * t * (b[0] - k[0]), y = 2 * (1 - t) * (k[1] - a[1]) + 2 * t * (b[1] - k[1]), l = Math.hypot(x, y); return [x / l, y / l]; };

    // Trunk: tapered outline plus growth rings.
    const left = [], right = [];
    let rings = '';
    for (let i = 0; i <= 30; i++) {
      const t = i / 30, p = bez(B, K, C, t), d = tan(B, K, C, t), n = [-d[1], d[0]], w = 17 - 9 * t;
      left.push([p[0] + n[0] * w, p[1] + n[1] * w]);
      right.push([p[0] - n[0] * w, p[1] - n[1] * w]);
      if (i % 2 === 1 && i < 29) {
        const a = left[i], b = right[i];
        rings += `M${f1(a[0])} ${f1(a[1])}Q${f1(p[0] + d[0] * 5)} ${f1(p[1] + d[1] * 5)} ${f1(b[0])} ${f1(b[1])}`;
      }
    }
    const trunk = 'M' + left.map((p) => p.map(f1).join(' ')).join('L') + 'L' + right.reverse().map((p) => p.map(f1).join(' ')).join('L') + 'Z';

    // Fronds: a drooping spine with leaflets hanging from both sides.
    function frond(angleDeg, len) {
      const a = (angleDeg * Math.PI) / 180, dir = [Math.cos(a), Math.sin(a)];
      const tip = [C[0] + dir[0] * len, C[1] + dir[1] * len + len * 0.42];
      const ctrl = [C[0] + dir[0] * len * 0.55, C[1] + dir[1] * len * 0.55 - len * 0.2];
      let leaves = '';
      const N = 30;
      for (let i = 2; i <= N; i++) {
        const t = i / (N + 1), p = bez(C, ctrl, tip, t), d = tan(C, ctrl, tip, t);
        const L = (22 + len * 0.13) * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.75)), 0.8) * (0.85 + R() * 0.3);
        for (const side of [-1, 1]) {
          const rot = side * (0.95 + R() * 0.2);
          let lx = d[0] * Math.cos(rot) - d[1] * Math.sin(rot), ly = d[0] * Math.sin(rot) + d[1] * Math.cos(rot);
          ly += 0.9; const ll = Math.hypot(lx, ly); lx /= ll; ly /= ll;
          const tx = p[0] + lx * L, ty = p[1] + ly * L, nx = -ly * 2.6, ny = lx * 2.6, mx = p[0] + lx * L * 0.45, my = p[1] + ly * L * 0.45;
          leaves += `M${f1(p[0])} ${f1(p[1])}Q${f1(mx + nx)} ${f1(my + ny)} ${f1(tx)} ${f1(ty)}Q${f1(mx - nx)} ${f1(my - ny)} ${f1(p[0])} ${f1(p[1])}Z`;
        }
      }
      return { leaves, spine: `M${C[0]} ${C[1]}Q${f1(ctrl[0])} ${f1(ctrl[1])} ${f1(tip[0])} ${f1(tip[1])}` };
    }
    const layer = (angles, cls) => angles.map((ang) => {
      const f = frond(ang + (R() - 0.5) * 10, 150 + R() * 60);
      return `<g><path class="${cls}" d="${f.leaves}"/><path class="spine" d="${f.spine}"/></g>`;
    }).join('');
    const back = layer([-160, -118, -72, -28, 18, 160], 'fb');
    const front = layer([-178, -140, -95, -50, -6, 38, 140], 'ff');
    const cocos = [[-9, 14], [8, 16], [0, 24]].map(([x, y]) => `<circle class="coco" cx="${C[0] + x}" cy="${C[1] + y}" r="10"/>`).join('');
    return `<path class="trunk" d="${trunk}"/><path class="ring" d="${rings}"/>` +
      `<g class="crown" style="transform-origin:${C[0]}px ${C[1]}px">${back}${cocos}${front}</g>`;
  }

  function buildScene() {
    const defs = '<defs><linearGradient id="trunkGrad" x1="0" x2="1"><stop offset="0" stop-color="var(--trunk1)"/><stop offset="1" stop-color="var(--trunk2)"/></linearGradient></defs>';
    $('#palmL').innerHTML = `<svg viewBox="0 0 400 640">${defs}${palmMarkup(7, 110)}</svg>`;
    $('#palmR').innerHTML = `<svg viewBox="0 0 400 640">${palmMarkup(21, 70)}</svg>`;
    $('#island').innerHTML = '<path d="M0 46 C30 30 60 26 100 28 S170 34 200 46Z"/>' +
      `<g transform="translate(40 -18) scale(.085)">${palmMarkup(3, 60)}</g>` +
      `<g transform="translate(78 -8) scale(.065)">${palmMarkup(11, 40)}</g>`;
    const R = rng(99);
    const stars = $('#stars');
    for (let i = 0; i < 70; i++) {
      const s = el('span', 'star');
      s.style.left = (R() * 100).toFixed(2) + '%';
      s.style.top = (R() * 95).toFixed(2) + '%';
      s.style.animationDelay = (-R() * 4).toFixed(2) + 's';
      if (R() > 0.85) s.style.width = s.style.height = '3px';
      stars.append(s);
    }
    const sea = $('#sea');
    for (let i = 0; i < 22; i++) {
      const s = el('span', 'sparkle');
      s.style.left = (R() * 100).toFixed(2) + '%';
      s.style.top = (4 + R() * 70).toFixed(2) + '%';
      s.style.width = (8 + R() * 26).toFixed(0) + 'px';
      s.style.animationDelay = (-R() * 5).toFixed(2) + 's';
      s.style.animationDuration = (3 + R() * 4).toFixed(2) + 's';
      sea.append(s);
    }
  }

  /* ---------- Init ---------- */
  buildScene();
  renderSavedLists();
  renderHistory();
  onListChange();
  setMode(mode);
})();
</script>
</body>
</html>
